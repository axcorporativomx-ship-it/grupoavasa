<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#41091f"><meta name="robots" content="noindex,nofollow"><title>Portal de colaboradores | Grupo AVASA</title><style>
:root{--wine:#681331;--dark:#41091f;--gold:#c2a06a;--cream:#f6f1e8;--paper:#fffdf9;--ink:#292329;--muted:#81777b;--line:#e9e0dc}*{box-sizing:border-box}body{margin:0;background:#f5f2ee;color:var(--ink);font:14px Inter,system-ui,Arial,sans-serif}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--dark)}.card{width:min(420px,100%);background:var(--paper);padding:38px;border-top:4px solid var(--gold)}.logo{font:700 29px Georgia,serif;letter-spacing:2px;color:var(--wine)}.logo span{color:var(--gold)}.eyebrow{font-size:10px;color:#9b7948;letter-spacing:.2em;font-weight:800;margin-top:20px}.card h1{font:36px Georgia,serif;color:var(--dark);margin:12px 0}.muted{color:var(--muted)}label{display:block;font-size:10px;font-weight:800;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid var(--line);font:inherit}.btn{border:0;background:var(--wine);color:white;padding:13px 18px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.card .btn{width:100%;margin-top:23px}.error{color:#a83245;font-size:12px;margin-top:13px}.portal{max-width:1000px;margin:auto;padding:35px 22px}.header{background:var(--dark);color:white;padding:25px 0}.headin{max-width:1000px;margin:auto;padding:0 22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.headin .logo{color:white}.headin .btn{background:#ffffff18;border:1px solid #ffffff50}.welcome{font:38px Georgia,serif;color:var(--dark);margin:8px 0}.profile{background:white;border:1px solid var(--line);padding:27px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field small{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em;text-transform:uppercase;font-weight:800}.field strong{display:block;margin-top:7px;font-size:15px;font-weight:600}.foot{font-size:11px;color:var(--muted);margin-top:30px}@media(max-width:600px){.grid{grid-template-columns:1fr}.headin{align-items:flex-start;flex-direction:column}.welcome{font-size:32px}}
</style></head><body>
<section id="loginView" class="login"><form id="loginForm" class="card"><div class="logo">GRUPO <span>AVASA</span></div><div class="eyebrow">PORTAL DE COLABORADORES</div><h1>Bienvenido.</h1><p class="muted">Accede con tu usuario y contraseña.</p><label>USUARIO</label><input id="username" autocomplete="username" required><label>CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" id="loginButton">Ingresar al portal</button><div id="error" class="error"></div></form></section>
<div id="portalView" class="hidden"><header class="header"><div class="headin"><div><div class="logo">GRUPO <span>AVASA</span></div><div style="font-size:10px;color:#ffffff9c;letter-spacing:.16em;margin-top:5px">PORTAL DE COLABORADORES</div></div><button class="btn" id="logout">Cerrar sesión</button></div></header><main class="portal"><div class="eyebrow">MI ESPACIO</div><h1 class="welcome" id="greeting">Hola.</h1><p class="muted">Consulta tu información de colaborador.</p><section class="profile"><h2 style="font:25px Georgia,serif;color:var(--dark);margin:0 0 24px">Mi perfil</h2><div class="grid" id="profileGrid"></div></section><div class="foot">Grupo AVASA · Ciudad Juárez, Chihuahua, México</div></main></div>
<script src="/assets/api.js"></script><script>
(()=>{const $=s=>document.querySelector(s),key='avasa_employee_token';let token=sessionStorage.getItem(key);function esc(v){return String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function loginView(){$('#loginView').classList.remove('hidden');$('#portalView').classList.add('hidden');}async function showPortal(){const r=await AvasaAPI.myProfile(token);if(!r.ok)throw new Error(r.message||'No se pudo consultar el perfil.');const p=r.profile||{};$('#greeting').textContent='Hola, '+(p.nombre||'colaborador')+'.';const names={nombre:'Nombre',correo:'Correo electrónico',telefono:'Teléfono',puesto:'Puesto',departamento:'Departamento',fecha_ingreso:'Fecha de ingreso',estado:'Estado'};$('#profileGrid').innerHTML=Object.entries(names).map(([k,v])=>'<div class="field"><small>'+v+'</small><strong>'+esc(p[k])+'</strong></div>').join('');$('#loginView').classList.add('hidden');$('#portalView').classList.remove('hidden');}$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');b.disabled=true;b.textContent='Validando…';$('#error').textContent='';try{const r=await AvasaAPI.login($('#username').value,$('#password').value);if(!r.ok)throw new Error(r.message||'Credenciales incorrectas.');token=r.token;sessionStorage.setItem(key,token);await showPortal();}catch(err){$('#error').textContent=err.message;}finally{b.disabled=false;b.textContent='Ingresar al portal';}};$('#logout').onclick=async()=>{try{await AvasaAPI.logout(token);}catch(e){}sessionStorage.removeItem(key);token=null;loginView();};(async()=>{if(token){try{const r=await AvasaAPI.validateSession(token);if(r.ok){await showPortal();return;}}catch(e){}sessionStorage.removeItem(key);token=null;}loginView();})();})();
</script></body></html>
