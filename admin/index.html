<!doctype html>
<html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#41091f"><meta name="robots" content="noindex,nofollow"><title>AVASA Control | Grupo AVASA</title>
<style>
:root{--wine:#681331;--dark:#41091f;--gold:#c2a06a;--cream:#f6f1e8;--paper:#fffdf9;--ink:#292329;--muted:#81777b;--line:#e9e0dc;--red:#a83245;--green:#267451}*{box-sizing:border-box}body{margin:0;background:#f4f1ed;color:var(--ink);font:14px Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 15%,#7b2946 0,transparent 30%),var(--dark)}.login-card{width:min(430px,100%);background:var(--paper);padding:42px;border-top:4px solid var(--gold);box-shadow:0 25px 80px #0004}.logo{font:700 30px Georgia,serif;letter-spacing:2px;color:var(--wine)}.logo span{color:var(--gold)}.eyebrow{color:#a17d48;font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.login-card h1{font:400 34px Georgia,serif;color:var(--dark);margin:12px 0}.muted{color:var(--muted)}label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;margin:17px 0 7px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);background:white;color:var(--ink);outline:none;border-radius:2px}input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c2a06a20}.btn{border:0;background:var(--wine);color:#fff;padding:12px 17px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.btn:hover{background:var(--dark)}.btn.gold{background:var(--gold);color:var(--dark)}.btn.light{background:#f1e9e5;color:var(--wine)}.btn.danger{background:#a83245}.btn:disabled{opacity:.5;cursor:wait}.login-card .btn{width:100%;margin-top:24px}.error{margin-top:14px;color:var(--red);font-size:12px}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--dark);color:white;padding:25px 17px;display:flex;flex-direction:column}.sidebar .logo{color:white;font-size:25px;padding:4px 12px 28px}.side-label{font-size:9px;color:#c2a06a;letter-spacing:.2em;font-weight:800;padding:17px 12px 8px}.navbtn{border:0;background:transparent;color:#ffffffbd;text-align:left;padding:12px;border-radius:3px;font-size:12px;display:flex;gap:10px;align-items:center}.navbtn:hover,.navbtn.active{background:#ffffff16;color:white}.navbtn.active{border-left:3px solid var(--gold)}.sidebar-bottom{margin-top:auto;border-top:1px solid #ffffff24;padding-top:16px}.main{min-width:0}.topbar{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.topbar strong{font:24px Georgia,serif;color:var(--dark)}.userbox{display:flex;align-items:center;gap:12px;font-size:12px}.avatar{width:34px;height:34px;background:var(--cream);color:var(--wine);display:grid;place-items:center;border-radius:50%;font-weight:800}.content{padding:32px 34px;max-width:1450px;margin:auto}.heading{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:24px}.heading h1{font:400 34px Georgia,serif;color:var(--dark);margin:0}.heading p{margin:6px 0 0;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:25px}.stat,.panel{background:white;border:1px solid var(--line);padding:20px}.stat small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.stat strong{display:block;font:34px Georgia,serif;color:var(--wine);margin-top:10px}.panel h2{font:22px Georgia,serif;color:var(--dark);margin:0 0 17px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:15px}.toolbar input{max-width:300px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:12px}th{background:#faf7f3;color:#75676b;font-size:9px;letter-spacing:.13em;text-transform:uppercase}td{max-width:280px;overflow-wrap:anywhere}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#f0e8e5;color:var(--wine);font-size:10px;font-weight:800}.pill.ok{background:#e7f3ed;color:var(--green)}.actions{display:flex;gap:7px}.small{padding:7px 10px;font-size:9px}.empty{padding:35px;text-align:center;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#18091099;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--paper);padding:27px;border-top:4px solid var(--gold)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font:26px Georgia,serif;color:var(--dark);margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.span2{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;right:22px;bottom:22px;background:var(--dark);color:white;padding:14px 18px;z-index:30;box-shadow:0 8px 30px #0003}.mobile-head{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;left:-260px;top:0;bottom:0;width:245px;transition:left .2s}.sidebar.open{left:0}.mobile-head{display:block;border:0;background:transparent;color:var(--wine);font-size:23px}.topbar{padding:0 18px}.content{padding:24px 18px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.login-card{padding:28px}.heading{align-items:start;flex-direction:column}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:27px}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.topbar strong{font-size:20px}}
</style></head><body>
<section id="loginView" class="login-wrap"><form id="loginForm" class="login-card"><div class="logo">AVASA <span>CONTROL</span></div><p class="eyebrow">Panel administrativo</p><h1>Bienvenido.</h1><p class="muted">Ingresa con tus credenciales autorizadas para continuar.</p><label for="username">USUARIO</label><input id="username" autocomplete="username" required maxlength="32"><label for="password">CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password" required><button class="btn" id="loginButton">Iniciar sesión</button><div id="loginError" class="error" role="alert"></div><p class="muted" style="font-size:10px;margin-top:25px">Grupo AVASA · Ciudad Juárez, Chihuahua</p></form></section>
<div id="appView" class="app hidden">
<aside class="sidebar" id="sidebar"><div class="logo">AVASA <span style="color:var(--gold)">CONTROL</span></div><div class="side-label">GENERAL</div><button class="navbtn active" data-view="dashboard">▦ &nbsp; Resumen</button><div class="side-label">GESTIÓN DE CONTENIDO</div><button class="navbtn" data-module="Boletines">▤ &nbsp; Boletines</button><button class="navbtn" data-module="Documentos">▧ &nbsp; Documentos</button><button class="navbtn" data-module="Galeria">▧ &nbsp; Galería</button><button class="navbtn" data-module="Proyectos">◇ &nbsp; Proyectos</button><button class="navbtn" data-module="Estadisticas">▥ &nbsp; Estadísticas</button><button class="navbtn" data-module="Paginas">▣ &nbsp; Páginas</button><div class="side-label">ORGANIZACIÓN</div><button class="navbtn" data-module="Empleados">♙ &nbsp; Empleados</button><button class="navbtn" data-view="users" id="usersNav">♧ &nbsp; Usuarios</button><button class="navbtn" data-module="Historial" id="historyNav">◷ &nbsp; Historial</button><div class="sidebar-bottom"><button class="navbtn" id="logoutButton">↪ &nbsp; Cerrar sesión</button><a class="navbtn" href="/" style="display:block">← &nbsp; Ver sitio público</a></div></aside>
<main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="mobile-head" id="mobileMenu">☰</button><strong id="pageTitle">Resumen</strong></div><div class="userbox"><div class="avatar" id="userInitial">A</div><div><b id="userName">Administrador</b><div class="muted" id="userRole">ADMIN</div></div></div></header><div class="content" id="content"><div class="empty">Cargando panel…</div></div></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="/assets/api.js"></script><script>
(()=>{'use strict';
const $=s=>document.querySelector(s), tokenKey='avasa_token';
let token=sessionStorage.getItem(tokenKey), currentModule='', currentRecords=[], currentHeaders=[];
const labels={Boletines:'Boletines',Documentos:'Documentos',Galeria:'Galería',Proyectos:'Proyectos',Estadisticas:'Estadísticas',Empleados:'Empleados',Paginas:'Páginas',Historial:'Historial'};
const fields={Boletines:[['titulo','Título'],['resumen','Resumen'],['contenido','Contenido','textarea'],['fecha','Fecha','date'],['estado','Estado','select','Borrador|Publicado'],['publico','Público','checkbox'],['imagen','URL de imagen']],Documentos:[['titulo','Título'],['descripcion','Descripción','textarea'],['url','URL'],['categoria','Categoría'],['fecha','Fecha','date'],['estado','Estado','select','Activo|Archivado'],['publico','Público','checkbox']],Galeria:[['titulo','Título'],['descripcion','Descripción','textarea'],['imagen','URL de imagen'],['fecha','Fecha','date'],['publico','Público','checkbox']],Proyectos:[['nombre','Nombre'],['descripcion','Descripción','textarea'],['avance','Avance (%)','number'],['estado','Estado'],['url','URL'],['publico','Público','checkbox']],Estadisticas:[['indicador','Indicador'],['valor','Valor'],['unidad','Unidad'],['periodo','Periodo'],['publico','Público','checkbox'],['orden','Orden','number']],Empleados:[['nombre','Nombre'],['correo','Correo','email'],['telefono','Teléfono'],['puesto','Puesto'],['departamento','Departamento'],['fecha_ingreso','Fecha de ingreso','date'],['estado','Estado']],Paginas:[['titulo','Título'],['slug','Slug'],['contenido','Contenido','textarea'],['estado','Estado'],['publico','Público','checkbox']]};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){$('#toastRoot').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>$('#toastRoot').innerHTML='',3200);}
function setBusy(btn,busy,text){if(!btn)return;btn.disabled=busy;if(busy)btn.dataset.old=btn.textContent;btn.textContent=busy?'Procesando…':(btn.dataset.old||text||btn.textContent);}
async function call(promise){const r=await promise;if(!r||r.ok!==true)throw new Error(r?.message||'La operación no se pudo completar.');return r;}
function showLogin(){ $('#loginView').classList.remove('hidden');$('#appView').classList.add('hidden'); }
function showApp(user){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userName').textContent=user.username||'Usuario';$('#userRole').textContent=user.role||'';$('#userInitial').textContent=(user.username||'A').slice(0,1).toUpperCase();$('#usersNav').classList.toggle('hidden',user.role!=='ADMIN');$('#historyNav').classList.toggle('hidden',user.role!=='ADMIN');document.querySelector('[data-module="Empleados"]').classList.toggle('hidden',!['ADMIN','RH'].includes(user.role));}
async function boot(){if(!token){showLogin();return;}try{const r=await AvasaAPI.validateSession(token);if(!r.ok)throw new Error('Sesión vencida');showApp(r);await dashboard();}catch(e){sessionStorage.removeItem(tokenKey);token=null;showLogin();}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('#loginButton');$('#loginError').textContent='';setBusy(b,true);try{const r=await AvasaAPI.login($('#username').value,$('#password').value);if(!r.ok)throw new Error(r.message||'Usuario o contraseña incorrectos.');token=r.token;sessionStorage.setItem(tokenKey,token);$('#password').value='';showApp(r);await dashboard();}catch(err){$('#loginError').textContent=err.message;}finally{setBusy(b,false);}});
$('#logoutButton').addEventListener('click',async()=>{try{await AvasaAPI.logout(token);}catch(e){}sessionStorage.removeItem(tokenKey);token=null;showLogin();});
$('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.querySelectorAll('.navbtn[data-view],.navbtn[data-module]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#sidebar').classList.remove('open');if(b.dataset.module)loadModule(b.dataset.module);else if(b.dataset.view==='users')loadUsers();else dashboard();}));
async function dashboard(){currentModule='';$('#pageTitle').textContent='Resumen';$('#content').innerHTML='<div class="empty">Cargando indicadores…</div>';try{const d=await call(AvasaAPI.dashboard(token));const cards=[['Usuarios',d.users],['Boletines',d.boletines],['Documentos',d.documentos],['Proyectos',d.proyectos],['Galería',d.galeria],['Empleados',d.empleados],['Estadísticas',d.estadisticas]];$('#content').innerHTML='<div class="heading"><div><h1>Resumen general</h1><p>Actividad y contenido registrado en Grupo AVASA.</p></div></div><div class="stats">'+cards.map(c=>'<article class="stat"><small>'+c[0]+'</small><strong>'+Number(c[1]||0)+'</strong></article>').join('')+'</div><section class="panel"><h2>Centro de administración</h2><p class="muted">Selecciona un módulo del menú para consultar, crear o actualizar información. Los permisos disponibles dependen de tu rol.</p></section>';}catch(e){$('#content').innerHTML='<div class="panel">'+esc(e.message)+'</div>';}}
async function loadModule(module){currentModule=module;$('#pageTitle').textContent=labels[module]||module;$('#content').innerHTML='<div class="empty">Cargando '+esc(labels[module])+'…</div>';try{const r=await call(AvasaAPI.listRecords(token,module));currentRecords=r.records||[];currentHeaders=r.headers||[];renderRecords();}catch(e){$('#content').innerHTML='<div class="panel">'+esc(e.message)+'</div>';}}
function renderRecords(){const m=currentModule,rows=currentRecords,headers=currentHeaders.filter(h=>h!=='contenido'&&h!=='descripcion');const canEdit=m!=='Historial';$('#content').innerHTML='<div class="heading"><div><h1>'+esc(labels[m])+'</h1><p>'+rows.length+' registros disponibles</p></div>'+(canEdit?'<button class="btn" id="newRecord">＋ Nuevo registro</button>':'')+'</div><div class="toolbar"><input id="filterRows" placeholder="Buscar en registros…"><span class="muted" style="font-size:11px">Datos conectados a Google Sheets</span></div><div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h.replace(/_/g,' '))+'</th>').join('')+(canEdit?'<th>Acciones</th>':'')+'</tr></thead><tbody id="recordRows"></tbody></table></div>';drawRows(rows,headers,canEdit);$('#filterRows').addEventListener('input',e=>drawRows(rows.filter(r=>JSON.stringify(r).toLowerCase().includes(e.target.value.toLowerCase())),headers,canEdit));if(canEdit)$('#newRecord').addEventListener('click',()=>openRecordForm(null));}
function drawRows(rows,headers,canEdit){const body=$('#recordRows');if(!body)return;if(!rows.length){body.innerHTML='<tr><td colspan="'+(headers.length+(canEdit?1:0))+'" class="empty">No hay registros para mostrar.</td></tr>';return;}body.innerHTML=rows.map((r,i)=>'<tr>'+headers.map(h=>'<td>'+esc(typeof r[h]==='boolean'?(r[h]?'Sí':'No'):r[h])+'</td>').join('')+(canEdit?'<td><div class="actions"><button class="btn light small" data-edit="'+i+'">Editar</button><button class="btn danger small" data-delete="'+i+'">Eliminar</button></div></td>':'')+'</tr>').join('');body.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openRecordForm(rows[Number(b.dataset.edit)])));body.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>deleteRecord(rows[Number(b.dataset.delete)])));}
function openRecordForm(record){const config=fields[currentModule]||[];if(!config.length)return;const controls=config.map(([key,label,type='text',opts])=>{const value=record?.[key]??'';if(type==='checkbox')return '<div class="span2" style="padding-top:17px"><label><input style="width:auto" type="checkbox" name="'+key+'" '+(value===true?'checked':'')+'> '+esc(label)+'</label></div>';if(type==='textarea')return '<div class="span2"><label>'+esc(label)+'</label><textarea name="'+key+'" rows="4">'+esc(value)+'</textarea></div>';if(type==='select')return '<div><label>'+esc(label)+'</label><select name="'+key+'">'+opts.split('|').map(o=>'<option '+(o===value?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';return '<div class="'+(key==='contenido'||key==='descripcion'?'span2':'')+'"><label>'+esc(label)+'</label><input name="'+key+'" type="'+type+'" value="'+esc(value)+'"></div>';}).join('');$('#modalRoot').innerHTML='<div class="modal-back"><form class="modal" id="recordForm"><div class="modal-head"><h2>'+(record?'Editar':'Nuevo')+' · '+esc(labels[currentModule])+'</h2><button type="button" class="btn light small" id="closeModal">✕</button></div><div class="form-grid">'+controls+'</div><div class="modal-actions"><button type="button" class="btn light" id="cancelModal">Cancelar</button><button class="btn" id="saveRecord">Guardar</button></div></form></div>';const close=()=>$('#modalRoot').innerHTML='';$('#closeModal').onclick=$('#cancelModal').onclick=close;$('#recordForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),data={};config.forEach(([key,,type])=>{data[key]=type==='checkbox'?e.currentTarget.elements[key].checked:fd.get(key)||'';});if(record?.id)data.id=record.id;const b=$('#saveRecord');setBusy(b,true);try{await call(AvasaAPI.saveRecord(token,currentModule,data));close();toast('Registro guardado correctamente.');await loadModule(currentModule);}catch(err){toast(err.message);setBusy(b,false);}});}
async function deleteRecord(record){if(!record?.id){toast('Este registro no tiene identificador.');return;}if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))return;try{await call(AvasaAPI.deleteRecord(token,currentModule,record.id));toast('Registro eliminado.');await loadModule(currentModule);}catch(e){toast(e.message);}}
async function loadUsers(){currentModule='';$('#pageTitle').textContent='Usuarios';$('#content').innerHTML='<div class="empty">Cargando usuarios…</div>';try{const r=await call(AvasaAPI.listUsers(token));const users=r.users||[];$('#content').innerHTML='<div class="heading"><div><h1>Usuarios del sistema</h1><p>Control de acceso y roles administrativos.</p></div><button class="btn" id="newUser">＋ Crear usuario</button></div><div class="table-wrap"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Creado</th><th>Acción</th></tr></thead><tbody>'+users.map((u,i)=>'<tr><td>'+esc(u.username)+'</td><td>'+esc(u.role)+'</td><td><span class="pill '+(u.active?'ok':'')+'">'+(u.active?'Activo':'Inactivo')+'</span></td><td>'+esc(u.created||'—')+'</td><td><button class="btn light small" data-toggle="'+i+'">'+(u.active?'Desactivar':'Activar')+'</button></td></tr>').join('')+'</tbody></table></div>';$('#newUser').onclick=openUserForm;document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const u=users[Number(b.dataset.toggle)];if(!confirm((u.active?'¿Desactivar':'¿Activar')+' a '+u.username+'?'))return;try{await call(AvasaAPI.setUserActive(token,u.username,!u.active));toast('Estado actualizado.');loadUsers();}catch(e){toast(e.message);}});}catch(e){$('#content').innerHTML='<div class="panel">'+esc(e.message)+'</div>';}}
function openUserForm(){$('#modalRoot').innerHTML='<div class="modal-back"><form class="modal" id="userForm"><div class="modal-head"><h2>Crear usuario</h2><button type="button" class="btn light small" id="closeModal">✕</button></div><label>Usuario</label><input name="username" required minlength="4" maxlength="32" pattern="[a-zA-Z0-9._-]+"><label>Contraseña (mínimo 12 caracteres)</label><input name="password" type="password" required minlength="12" maxlength="256"><label>Rol</label><select name="role"><option>EMPLOYEE</option><option>EDITOR</option><option>RH</option><option>ADMIN</option></select><label>ID de empleado (opcional)</label><input name="employeeId"><div class="modal-actions"><button type="button" class="btn light" id="cancelModal">Cancelar</button><button class="btn" id="saveUser">Crear usuario</button></div></form></div>';const close=()=>$('#modalRoot').innerHTML='';$('#closeModal').onclick=$('#cancelModal').onclick=close;$('#userForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),b=$('#saveUser');setBusy(b,true);try{await call(AvasaAPI.createUser(token,f.get('username'),f.get('password'),f.get('role'),f.get('employeeId')));close();toast('Usuario creado.');loadUsers();}catch(err){toast(err.message);setBusy(b,false);}};}
boot();
})();
</script></body></html>
