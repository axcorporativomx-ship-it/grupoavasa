<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#681331">
<title>AVASA Control | Acceso administrativo</title>
<style>
:root{--wine:#681331;--deep:#41091f;--gold:#c2a06a;--cream:#fffaf2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,var(--deep),var(--wine));font-family:Arial,Helvetica,sans-serif;color:#30272a}
main{width:min(100%,460px);padding:42px 34px;background:var(--cream);border:1px solid var(--gold);border-radius:18px;text-align:center;box-shadow:0 25px 80px #16000a66}
.brand{font:800 23px Georgia,serif;letter-spacing:.13em;color:var(--wine)}
.brand span{color:var(--gold)}
h1{font:400 32px Georgia,serif;color:var(--wine);margin:25px 0 10px}
p{font-size:14px;line-height:1.7;color:#766b6d}
a{display:block;margin-top:25px;padding:15px 18px;background:var(--wine);color:white;text-decoration:none;font-weight:700;border-radius:8px}
a:hover{background:var(--deep)}
small{display:block;margin-top:18px;color:#8b7c7e;font-size:11px}
</style>
</head>
<body>
<main>
<div class="brand"><span>GRUPO</span> AVASA</div>
<h1>AVASA Control</h1>
<p>Abriendo el acceso administrativo seguro. Inicia sesión con el usuario y la contraseña registrados en la hoja de usuarios de Google Sheets.</p>
<a id="openApp" href="https://script.google.com/macros/s/AKfycbynFq4bv5nLNS67X3bVkmvU9WGn0qSGmYzkU329o2ZRtgOZf4NAVVN3HcYoQ2RRpkVlQQ/exec">Entrar a AVASA Control</a>
<small>Acceso privado · Grupo AVASA</small>
</main>

</body>
</html>
